name: Architecture review pilot
on:
  push:
    branches: [codex/c4-architecture-pilot-bbac6ee]

permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    name: Review PR #${{ matrix.pr_number }}
    strategy:
      fail-fast: false
      matrix:
        pr_number: ['45', '34']
    uses: zrack/c4-architect-mcp/.github/workflows/pr-architecture-review-report.yml@c2a0434e29a1b8df8ea7b453cc84e7fa553bcd02
    with:
      pr_number: ${{ matrix.pr_number }}
      source_root: ./src/
